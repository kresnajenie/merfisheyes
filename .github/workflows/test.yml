name: Tests

on:
  push: # run unit tests on every push to any branch
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    # A throwaway database for the few unit tests that need one
    # (tests/unit/agent-oauth-db.test.ts); every other test ignores it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: unit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/unit
      DIRECT_URL: postgresql://test:test@localhost:5432/unit
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Migrate the test database
        run: npx prisma migrate deploy

      - name: Run unit tests
        run: npm test

  format-specs:
    name: Format specs (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install the validators' dependencies
        run: pip install -r tests/python/requirements.txt

      - name: Validate the tiny fixtures and round-trip through spatialdata
        run: python -m pytest tests/python -q
